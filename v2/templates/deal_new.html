{% extends "base.html" %}
{% block title %}New Deal{% endblock %}
{% block content %}
<div class="page-title">New Deal</div>

<div class="panel">
  <div class="row">
    <div><label>Counterparty</label><input type="text" id="d-counterparty" placeholder="Name or table #" autofocus></div>
    <div><label>Location</label><input type="text" id="d-location" placeholder="optional"></div>
    <div><label>Payment</label>
      <select id="d-method">{% for m in methods %}<option>{{ m }}</option>{% endfor %}</select>
    </div>
    <div><label>When</label><input type="datetime-local" id="d-when"></div>
  </div>
</div>

<div class="deal-grid">
  <div class="panel deal-col">
    <h2><span>Cards Out <span class="muted">(from inventory)</span></span><span id="out-total" class="muted"></span></h2>
    <div style="position:relative;margin-bottom:10px">
      <input type="text" id="out-search" placeholder="Search inventory to add…" style="width:100%">
      <div class="picker-results" id="out-results" hidden></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <span class="muted" style="font-size:12px">Value my side at</span>
      <button type="button" class="btn ghost small rate-btn" data-rate="85">85%</button>
      <button type="button" class="btn ghost small rate-btn" data-rate="88">88%</button>
      <button type="button" class="btn ghost small rate-btn" data-rate="90">90%</button>
      <button type="button" class="btn ghost small rate-btn" data-rate="100">100%</button>
      <input type="text" id="out-rate" style="width:52px;text-align:right;min-height:auto">
      <span class="muted" style="font-size:12px">% of market — fills every line; edit any line after</span>
    </div>
    <div id="out-lines"></div>
    <div class="row" style="margin-top:8px">
      <div><label>Cash I pay</label>
        <input type="text" id="cash-paid" placeholder="0.00" style="width:130px"></div>
      <div><label>Side total (optional — allocates pro rata)</label>
        <input type="text" id="out-side-total" placeholder="$"></div>
    </div>
  </div>

  <div class="panel deal-col">
    <h2><span>Cards In <span class="muted">(quick entry)</span></span><span id="in-total" class="muted"></span></h2>
    <div id="in-lines"></div>
    <button class="btn ghost small" id="add-in">+ Add card</button>
    <div class="row" style="margin-top:12px">
      <div><label>Cash I receive</label>
        <input type="text" id="cash-received" placeholder="0.00" style="width:130px"></div>
      <div><label>Side total (optional)</label>
        <input type="text" id="in-side-total" placeholder="$"></div>
      <div style="align-self:end;padding-bottom:2px">
        <button type="button" class="btn ghost small" id="fill-from-cash"
                title="Pure sale: split the cash received across the cards out, pro rata by market">← fill cards out from cash</button>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <div style="flex:1"><label>Notes</label><input type="text" id="d-notes" style="width:100%"></div>
  </div>
</div>

<div class="totals-bar">
  <div>Giving <span class="big" id="t-out">$0.00</span>
    <div class="muted" id="t-out-mkt" style="font-size:11px"></div></div>
  <div>Getting <span class="big" id="t-in">$0.00</span></div>
  <div>Cash <span class="big" id="t-cash">$0.00</span></div>
  <div title="Deal values on cards out minus their cost basis — the realized gain this deal books when saved">
    Profit over basis <span class="big" id="t-profit">—</span>
    <span class="muted" id="t-profit-note" style="font-size:11px"></span></div>
  <div id="t-balance" class="muted"></div>
  <div style="flex:1"></div>
  <button class="btn" id="save">Save Deal</button>
</div>
<div id="save-msg" style="margin-top:10px"></div>

<script>
const INVENTORY = {{ cards|tojson }};
const outLines = [];   // {table,id,name,label,mv,deal_value(str)}
const inLines  = [];   // {name,set,number,year,company,grade,cert,is_graded,deal_value(str)}

const $ = id => document.getElementById(id);
const num = s => { const v = parseFloat(String(s).replace(/[$,]/g, "")); return isNaN(v) ? null : v; };

/* default timestamp = now */
(() => {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  $("d-when").value = d.toISOString().slice(0, 16);
})();

/* ── cards-out picker ── */
const search = $("out-search"), results = $("out-results");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { results.hidden = true; results.innerHTML = ""; return; }
  const taken = new Set(outLines.map(l => l.table + ":" + l.id));
  const hits = INVENTORY.filter(c =>
    !taken.has(c.table + ":" + c.id) &&
    (c.name + " " + c.set + " " + c.cert).toLowerCase().includes(q)).slice(0, 12);
  results.innerHTML = hits.map((c, i) =>
    `<div data-i="${INVENTORY.indexOf(c)}">
       ${c.kind === "slab" ? `<span class="chip ${esc(c.company)}">${esc(c.company)} ${esc(c.grade)}</span>` : '<span class="chip raw">RAW</span>'}
       ${esc(c.name)} <span class="muted">${esc(c.set)}</span>
       <span class="muted" style="float:right">${fmt(c.market_value ?? c.basis)}
         · <span class="unknown">${c.basis_unknown ? "basis ?" : "basis " + fmt(c.basis)}</span></span>
     </div>`).join("") || '<div class="muted">no matches</div>';
  results.hidden = false;
});
search.addEventListener("keydown", e => {
  if (e.key === "Enter" && !results.hidden) {
    const first = results.querySelector("div[data-i]");
    if (first) pickOut(+first.dataset.i);
  } else if (e.key === "Escape") { results.hidden = true; results.innerHTML = ""; }
});
results.addEventListener("mousedown", e => {
  const el = e.target.closest("div[data-i]"); if (el) pickOut(+el.dataset.i);
});
function pickOut(i) {
  const c = INVENTORY[i];
  if (outLines.some(l => l.table === c.table && l.id === c.id)) {
    search.value = ""; results.hidden = true; results.innerHTML = "";
    return;   // already added — a double-Enter must not dispose a card twice
  }
  // The agreed price starts EMPTY — market is context, never a default.
  // Prefilling market here is what booked $X of proceeds on a $X
  // sale and recorded a deliberate below-market trade as +$1,900 of profit.
  // If a rate has been chosen this session, new lines fill at that rate,
  // visibly, because that rate was the user's own decision.
  const r = rateTouched ? num($("out-rate").value) : null;
  outLines.push({ table: c.table, id: c.id, name: c.name,
    label: (c.kind === "slab" ? `${c.company} ${c.grade} · ` : "RAW · ") + c.name,
    mv: c.market_value ?? c.basis,
    basis: c.basis, basis_unknown: c.basis_unknown,
    deal_value: (r !== null && c.market_value != null)
      ? String(Math.round(c.market_value * r) / 100) : "" });
  search.value = ""; results.hidden = true; results.innerHTML = "";
  renderLines(); search.focus();
}

/* ── the rate control: one decision instead of one per card ── */
let rateTouched = false;   // remembered rate is shown but never applies silently
try { $("out-rate").value = localStorage.getItem("cv_deal_rate") || ""; } catch (e) {}
function applyRate() {
  const r = num($("out-rate").value);
  if (r === null || r <= 0) return;
  rateTouched = true;
  try { localStorage.setItem("cv_deal_rate", String(r)); } catch (e) {}
  outLines.forEach(l => {
    if (l.mv != null) l.deal_value = String(Math.round(l.mv * r) / 100);
  });
  renderLines();
}
document.querySelectorAll(".rate-btn").forEach(b =>
  b.addEventListener("click", () => { $("out-rate").value = b.dataset.rate; applyRate(); }));
$("out-rate").addEventListener("input", applyRate);

/* pure sale helper: the cash IS the proceeds, so let it fill the lines */
function fillFromCash() {
  const cash = cashReceived();
  if (!cash || !outLines.length) return;
  const w = outLines.map(l => (l.mv && l.mv > 0) ? l.mv : (l.basis || 1));
  const tw = w.reduce((a, b) => a + b, 0);
  let run = 0;
  outLines.forEach((l, i) => {
    let v = i === outLines.length - 1 ? Math.round((cash - run) * 100) / 100
                                      : Math.round(cash * w[i] / tw * 100) / 100;
    run += v;
    l.deal_value = String(v);
  });
  renderLines();
}

/* ── cards-in quick entry ── */
$("add-in").addEventListener("click", () => { addIn(); renderLines(); focusLastIn(); });
function addIn() {
  inLines.push({ name: "", set: "", number: "", year: "", company: "PSA",
                 grade: "", cert: "", is_graded: true,
                 deal_value: "", market_value: "" });
}
function focusLastIn() {
  const rows = document.querySelectorAll("#in-lines .deal-line");
  const last = rows[rows.length - 1];
  if (last) last.querySelector("input").focus();
}

function renderLines() {
  $("out-lines").innerHTML = outLines.map((l, i) => `
    <div class="deal-line">
      <span class="grow">${esc(l.label)}
        <span class="muted">mv ${fmt(l.mv)}</span>
        ${l.basis_unknown ? '<span class="unknown">· basis unknown</span>'
                          : `<span class="muted">· basis ${fmt(l.basis)}</span>`}</span>
      <button type="button" class="btn ghost small" data-mkt="${i}" tabindex="-1"
              title="Use full market value for this card">=mkt</button>
      <input class="val" data-side="out" data-i="${i}" type="text"
             placeholder="agreed $" value="${esc(l.deal_value)}">
      <span class="x" data-out="${i}">✕</span>
    </div>`).join("") || '<div class="muted" style="margin-bottom:8px">No cards out — pure buy.</div>';

  $("in-lines").innerHTML = inLines.map((l, i) => `
    <div class="deal-line" style="flex-wrap:wrap">
      <input type="text" placeholder="Card name" style="flex:2;min-width:140px"
             data-in="${i}" data-f="name" value="${esc(l.name)}">
      <input type="text" placeholder="Set" style="flex:1;min-width:90px"
             data-in="${i}" data-f="set" value="${esc(l.set)}">
      <select data-in="${i}" data-f="is_graded" style="width:86px">
        <option value="1" ${l.is_graded ? "selected" : ""}>Slab</option>
        <option value="" ${!l.is_graded ? "selected" : ""}>Raw</option>
      </select>
      ${l.is_graded ? `
        <select data-in="${i}" data-f="company" style="width:80px">
          ${["PSA","BGS","CGC","TAG"].map(co => `<option ${l.company===co?"selected":""}>${co}</option>`).join("")}
        </select>
        <input type="text" placeholder="Grade" style="width:70px" data-in="${i}" data-f="grade" value="${esc(l.grade)}">
        <input type="text" placeholder="Cert #" style="width:110px" data-in="${i}" data-f="cert" value="${esc(l.cert)}">
        <input type="text" placeholder="Year" style="width:64px" data-in="${i}" data-f="year" value="${esc(l.year)}">
        ${l.company === "PSA" ? `<button type="button" class="btn ghost small" data-cert-lookup="${i}"
            title="Fetch name/set/# from PSA">${l._certBusy ? "…" : "PSA ↻"}</button>` : ""}` : ""}
      <input type="text" placeholder="mkt (ref)" style="width:78px;text-align:right;opacity:.7"
             data-in="${i}" data-f="market_value" value="${esc(l.market_value)}"
             title="Reference only — what the card is worth. Never affects basis; basis comes from the paid $ field.">
      <input class="val" type="text" placeholder="paid $" data-side="in" data-i="${i}"
             value="${esc(l.deal_value)}" style="width:88px"
             title="What you paid / what it counts for in this deal — this becomes the cost basis">
      <span class="x" data-inx="${i}">✕</span>
      ${l._certMsg ? `<div style="width:100%;font-size:11px;color:var(--${l._certOk ? "pos" : "neg"})">${esc(l._certMsg)}</div>` : ""}
    </div>`).join("") || '<div class="muted" style="margin-bottom:8px">No cards in — pure sale.</div>';

  bindLineEvents();
  updateTotals();
}

function bindLineEvents() {
  document.querySelectorAll("#out-lines .x").forEach(x =>
    x.addEventListener("click", () => { outLines.splice(+x.dataset.out, 1); renderLines(); }));
  document.querySelectorAll("#out-lines [data-mkt]").forEach(b =>
    b.addEventListener("click", () => {
      const l = outLines[+b.dataset.mkt];
      if (l.mv != null) { l.deal_value = String(l.mv); renderLines(); }
    }));
  document.querySelectorAll("#in-lines .x").forEach(x =>
    x.addEventListener("click", () => { inLines.splice(+x.dataset.inx, 1); renderLines(); }));
  document.querySelectorAll("input.val").forEach(inp =>
    inp.addEventListener("input", () => {
      const arr = inp.dataset.side === "out" ? outLines : inLines;
      arr[+inp.dataset.i].deal_value = inp.value;
      updateTotals();
    }));
  document.querySelectorAll("[data-in][data-f]").forEach(el =>
    el.addEventListener("change", () => {
      const l = inLines[+el.dataset.in], f = el.dataset.f;
      if (f === "is_graded") { l.is_graded = !!el.value; renderLines(); }
      else if (f === "company") { l.company = el.value; renderLines(); }
      else l[f] = el.value;
    }));
  document.querySelectorAll("[data-cert-lookup]").forEach(btn =>
    btn.addEventListener("click", () => certLookup(+btn.dataset.certLookup)));
}

async function certLookup(i) {
  const l = inLines[i];
  const cert = (l.cert || "").trim();
  if (!cert) { l._certMsg = "Enter a cert number first."; l._certOk = false; renderLines(); return; }
  l._certBusy = true; renderLines();
  try {
    const res = await postJSON("/api/psa/lookup", { cert });
    const d = res.data;
    if (!l.name)   l.name   = d.card_name   || l.name;
    if (!l.set)    l.set    = d.set_name    || l.set;
    if (!l.number) l.number = d.card_number || l.number;
    if (!l.year)   l.year   = d.year        || l.year;
    if (!l.grade)  l.grade  = d.grade       || l.grade;
    l._certMsg = `Filled from PSA cert${res.status === "cached" ? " (cached)" : ""} ✓`;
    l._certOk = true;
  } catch (err) {
    l._certMsg = err.message;
    l._certOk = false;
  }
  l._certBusy = false;
  renderLines();
}

/* Cash is entered per side — no signs to get wrong. The engine still takes one
   signed amount, so net it here: received - paid. */
function cashPaid()     { return num($("cash-paid").value) ?? 0; }
function cashReceived() { return num($("cash-received").value) ?? 0; }
function netCash()      { return cashReceived() - cashPaid(); }

function updateTotals() {
  const cash = netCash();
  const outVals = outLines.map(l => num(l.deal_value));
  const inVals  = inLines.map(l => num(l.deal_value));
  // no cards out is a real value (0 — a pure buy), not an unknown side
  const vOut = outLines.length
    ? (outVals.every(v => v !== null)
        ? outVals.reduce((a, b) => a + b, 0) : num($("out-side-total").value))
    : 0;
  const vIn = inVals.every(v => v !== null) && inLines.length
    ? inVals.reduce((a, b) => a + b, 0)
    : (inLines.length ? num($("in-side-total").value) : 0);

  // each side's headline includes its own cash, mirroring how the deal is entered
  $("t-out").textContent = vOut !== null ? fmt(vOut + cashPaid()) : "…";
  $("t-in").textContent  = vIn  !== null ? fmt(vIn + cashReceived()) : "…";
  $("t-cash").textContent = fmtGain(cash);
  $("out-total").textContent = outLines.length + " cards";
  $("in-total").textContent  = inLines.length + " cards";

  // the number that matters: what these cards fetch vs what they cost
  const known = outLines.filter(l => !l.basis_unknown);
  const unknownN = outLines.length - known.length;
  if (outLines.length && vOut !== null) {
    const knownVals = known.map(l => num(l.deal_value));
    if (knownVals.every(v => v !== null)) {
      const profit = knownVals.reduce((a, b) => a + b, 0)
                   - known.reduce((a, l) => a + (l.basis || 0), 0);
      $("t-profit").textContent = fmtGain(profit);
      $("t-profit").className = "big " + gainClass(profit);
      $("t-profit-note").textContent = unknownN ? `(${unknownN} basis unknown)` : "";
    } else {
      $("t-profit").textContent = "…";
      $("t-profit-note").textContent = "enter per-card values";
    }
  } else {
    $("t-profit").textContent = "—";
    $("t-profit").className = "big muted";
    $("t-profit-note").textContent = "";
  }

  // context, not a warning: what the agreed give-side is as a % of market.
  // Selling at 85% is the business model — the app's job is to say it out
  // loud, not to argue, and never to quietly book market instead.
  const mktOut = outLines.reduce((a, l) => a + (l.mv || 0), 0);
  const mk = $("t-out-mkt");
  if (outLines.length && vOut !== null && vOut > 0 && mktOut > 0 && Math.abs(vOut - mktOut) > 0.5) {
    const pct = 100 * vOut / mktOut;
    mk.textContent = `market ${fmt(mktOut)} · this deal ${pct.toFixed(1)}%`
      + (vOut < mktOut ? ` · giving up ${fmt(mktOut - vOut)}` : "");
  } else mk.textContent = "";

  const bal = $("t-balance");
  // a pure sale books at the cash no matter what the lines say — show that
  // here instead of letting the engine silently rescale after Save. Blank
  // in-rows don't count: the server drops them at save, so a seeded empty
  // row must not hide the pure-sale behaviour from the user.
  const namedIn = inLines.filter(l => (l.name || "").trim()).length;
  if (outLines.length && !namedIn && cashReceived() > 0
      && vOut !== null && Math.abs(vOut - cashReceived()) > 0.01) {
    bal.textContent = `Pure sale: proceeds will book at cash ${fmt(cashReceived())}, `
      + `scaled pro rata (lines total ${fmt(vOut)})`;
    bal.className = "muted";
    return;
  }
  if (vOut !== null && vIn !== null) {
    // net = what I receive (cards in + cash) minus what I give up (cards out).
    // Positive means I come out ahead on this deal — that's the goal, so it's green.
    const net = (vIn + cash) - vOut;
    if (Math.abs(net) < 0.01) {
      bal.textContent = "Balanced ✓";
    } else if (net > 0) {
      bal.textContent = `${fmt(net)} in your favor`;
    } else {
      bal.textContent = `${fmt(Math.abs(net))} against you`;
    }
    bal.className = gainClass(net);
  } else bal.textContent = "";
}
["cash-paid", "cash-received", "out-side-total", "in-side-total"].forEach(id =>
  $(id).addEventListener("input", updateTotals));
$("fill-from-cash").addEventListener("click", fillFromCash);

/* ── save ── */
$("save").addEventListener("click", async () => {
  const msg = $("save-msg");
  if ($("save").disabled) return;
  $("save").disabled = true;            // a double-click must not book twice
  $("save").textContent = "Saving…";
  msg.innerHTML = "";
  try {
    const res = await postJSON("/api/deals", {
      counterparty: $("d-counterparty").value, location: $("d-location").value,
      payment_method: $("d-method").value,
      occurred_at: $("d-when").value ? $("d-when").value + ":00" : null,
      notes: $("d-notes").value,
      cash_amount: netCash(),
      out_side_total: num($("out-side-total").value),
      in_side_total: num($("in-side-total").value),
      cards_out: outLines.map(l => ({ table: l.table, id: l.id, deal_value: num(l.deal_value) })),
      cards_in: inLines.map(l => ({ name: l.name, set: l.set, number: l.number,
        year: l.year, company: l.company, grade: l.grade, cert: l.cert,
        is_graded: l.is_graded, deal_value: num(l.deal_value),
        market_value: num(l.market_value) })),
    });
    // The deal IS saved at this point — warnings must be readable, not blown
    // away by an instant redirect (which is exactly how a 12-card deal got
    // booked at $0 basis unnoticed).
    const warns = res.warnings || [];
    if (warns.length) {
      msg.innerHTML =
        `<div class="warn"><strong>Deal #${res.deal_id} saved with warnings:</strong><ul style="margin:6px 0 0 18px">`
        + warns.map(w => `<li>${esc(w)}</li>`).join("") + `</ul></div>`
        + `<a class="btn" href="/deals/${res.deal_id}">Open deal #${res.deal_id} →</a>`;
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    } else {
      location.href = "/deals/" + res.deal_id;
    }
  } catch (e) {
    msg.innerHTML = `<div class="warn">${esc(e.message)}</div>`;
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  } finally {
    $("save").disabled = false;
    $("save").textContent = "Save Deal";
  }
});

/* ── prefill handed over from the Evaluator ── */
function applyPrefill() {
  const raw = sessionStorage.getItem("cardvault_deal_prefill");
  if (!raw) return false;
  sessionStorage.removeItem("cardvault_deal_prefill");   // one-shot
  let p;
  try { p = JSON.parse(raw); } catch { return false; }

  (p.cards_out || []).forEach(o => {
    const c = INVENTORY.find(x => x.table === o.table && x.id === o.id);
    if (!c) return;   // sold/changed since evaluating — skip rather than fake it
    outLines.push({ table: c.table, id: c.id, name: c.name,
      label: (c.kind === "slab" ? `${c.company} ${c.grade} · ` : "RAW · ") + c.name,
      mv: c.market_value ?? c.basis,
      basis: c.basis, basis_unknown: c.basis_unknown,
      deal_value: String(o.deal_value ?? "") });
  });
  (p.cards_in || []).forEach(i => {
    inLines.push({ name: i.name || "", set: "", number: "", year: "", company: "PSA",
                   grade: "", cert: "", is_graded: true,
                   deal_value: String(i.deal_value ?? ""),
                   market_value: String(i.market_value ?? "") });
  });
  // evaluator hands over one signed figure; split it onto the correct side
  const c = num(p.cash) ?? 0;
  if (c > 0) $("cash-received").value = c;
  else if (c < 0) $("cash-paid").value = Math.abs(c);

  const missing = (p.cards_out || []).length - outLines.length;
  if (missing > 0) {
    $("save-msg").innerHTML =
      `<div class="warn">${missing} card(s) from the evaluation are no longer in active inventory and were skipped.</div>`;
  }
  return true;
}

if (!applyPrefill()) addIn();   /* seed one blank incoming row only if not prefilled */
if (!inLines.length) addIn();
renderLines();
updateTotals();
</script>
{% endblock %}
