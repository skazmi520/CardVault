{% extends "base.html" %}
{% block title %}New Deal{% endblock %}
{% block content %}
<div class="page-title">New Deal</div>

<div class="panel">
  <div class="row">
    <div><label>Counterparty</label><input type="text" id="d-counterparty" placeholder="Name or table #" autofocus></div>
    <div><label>Location</label><input type="text" id="d-location" placeholder="optional"></div>
    <div><label>Payment</label>
      <select id="d-method">{% for m in methods %}<option>{{ m }}</option>{% endfor %}</select>
    </div>
    <div><label>When</label><input type="datetime-local" id="d-when"></div>
  </div>
</div>

<div class="deal-grid">
  <div class="panel deal-col">
    <h2><span>Leaving <span class="muted">(my cards)</span></span><span id="out-total" class="muted"></span></h2>
    <div style="position:relative;margin-bottom:10px">
      <input type="text" id="out-search" placeholder="Search inventory to add…" style="width:100%">
      <div class="picker-results" id="out-results" hidden></div>
    </div>
    <div id="out-lines"></div>
    <div class="row" style="margin-top:8px">
      <div><label>Cash I pay</label>
        <input type="text" id="cash-paid" placeholder="0.00" style="width:130px"></div>
    </div>
  </div>

  <div class="panel deal-col">
    <h2><span>Arriving <span class="muted">(their cards + cash)</span></span><span id="in-total" class="muted"></span></h2>
    <div id="in-lines"></div>
    <button class="btn ghost small" id="add-in">+ Add card</button>
    <div class="row" style="margin-top:12px">
      <div><label>Cash I receive</label>
        <input type="text" id="cash-received" placeholder="0.00" style="width:130px"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="row" style="align-items:flex-end">
    <div>
      <label id="price-label">My cards are going out at ($)</label>
      <input type="text" id="deal-price" placeholder="deal total" style="width:150px;font-size:17px">
    </div>
    <div id="price-chips" style="display:flex;gap:6px;align-items:center;padding-bottom:4px;flex-wrap:wrap">
      <button type="button" class="btn ghost small price-chip" data-pct="85">85%</button>
      <button type="button" class="btn ghost small price-chip" data-pct="88">88%</button>
      <button type="button" class="btn ghost small price-chip" data-pct="90">90%</button>
      <button type="button" class="btn ghost small price-chip" data-pct="100">100%</button>
      <span class="muted" id="price-hint" style="font-size:12px"></span>
    </div>
    <div style="flex:1"></div>
    <div style="padding-bottom:4px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0">
        <input type="checkbox" id="adjust-mode" style="min-height:auto">
        <span class="muted" style="font-size:12px">adjust per card</span></label>
    </div>
  </div>
  <div class="row" style="margin-top:6px">
    <div style="flex:1"><label>Notes</label><input type="text" id="d-notes" style="width:100%"></div>
  </div>
</div>

<div class="panel" id="preview-panel">
  <div id="pv-sentence" class="muted" style="font-size:14px;margin-bottom:6px">Add cards to see what will book.</div>
  <div id="pv-market" style="font-size:13px;margin-bottom:6px"></div>
  <div id="pv-warnings"></div>
  <div style="display:flex;align-items:center;gap:14px;margin-top:8px">
    <div>Realized <span class="big" id="t-realized">—</span></div>
    <div>Paper on arriving <span class="big" id="t-paper">—</span></div>
    <div style="flex:1"></div>
    <button class="btn" id="save">Save Deal</button>
  </div>
</div>
<div id="save-msg" style="margin-top:10px"></div>

<script>
const INVENTORY = {{ cards|tojson }};
const outLines = [];   // {table,id,name,label,mv,basis,basis_unknown,deal_value(str)}
const inLines  = [];   // {name,set,number,year,company,grade,cert,is_graded,deal_value(str),market_value(str)}

const $ = id => document.getElementById(id);
const num = s => { const v = parseFloat(String(s).replace(/[$,]/g, "")); return isNaN(v) ? null : v; };

(() => {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  $("d-when").value = d.toISOString().slice(0, 16);
})();

/* ── my cards picker ── */
const search = $("out-search"), results = $("out-results");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { results.hidden = true; results.innerHTML = ""; return; }
  const taken = new Set(outLines.map(l => l.table + ":" + l.id));
  const hits = INVENTORY.filter(c =>
    !taken.has(c.table + ":" + c.id) &&
    (c.name + " " + c.set + " " + c.cert).toLowerCase().includes(q)).slice(0, 12);
  results.innerHTML = hits.map(c =>
    `<div data-i="${INVENTORY.indexOf(c)}">
       ${c.kind === "slab" ? `<span class="chip ${esc(c.company)}">${esc(c.company)} ${esc(c.grade)}</span>` : '<span class="chip raw">RAW</span>'}
       ${esc(c.name)} <span class="muted">${esc(c.set)}</span>
       <span class="muted" style="float:right">${fmt(c.market_value ?? c.basis)}
         · <span class="unknown">${c.basis_unknown ? "basis ?" : "basis " + fmt(c.basis)}</span></span>
     </div>`).join("") || '<div class="muted">no matches</div>';
  results.hidden = false;
});
search.addEventListener("keydown", e => {
  if (e.key === "Enter" && !results.hidden) {
    const first = results.querySelector("div[data-i]");
    if (first) pickOut(+first.dataset.i);
  } else if (e.key === "Escape") { results.hidden = true; results.innerHTML = ""; }
});
results.addEventListener("mousedown", e => {
  const el = e.target.closest("div[data-i]"); if (el) pickOut(+el.dataset.i);
});
function pickOut(i) {
  const c = INVENTORY[i];
  if (outLines.some(l => l.table === c.table && l.id === c.id)) {
    search.value = ""; results.hidden = true; results.innerHTML = "";
    return;   // a double-Enter must not dispose a card twice
  }
  // Newest first, and NO price: a deal has one price, entered once below.
  // Per-card overrides live behind "adjust per card" for the rare tiered deal.
  outLines.unshift({ table: c.table, id: c.id, name: c.name,
    label: (c.kind === "slab" ? `${c.company} ${c.grade} · ` : "RAW · ") + c.name,
    mv: c.market_value ?? c.basis,
    basis: c.basis, basis_unknown: c.basis_unknown, deal_value: "" });
  search.value = ""; results.hidden = true; results.innerHTML = "";
  renderLines(); search.focus();
}

/* ── their cards quick entry ── */
$("add-in").addEventListener("click", () => { addIn(); renderLines(); focusLastIn(); });
function addIn() {
  inLines.push({ name: "", set: "", number: "", year: "", company: "PSA",
                 grade: "", cert: "", is_graded: true,
                 deal_value: "", market_value: "" });
}
function focusLastIn() {
  const rows = document.querySelectorAll("#in-lines .deal-line");
  const last = rows[rows.length - 1];
  if (last) last.querySelector("input").focus();
}

const adjusting = () => $("adjust-mode").checked;

function renderLines() {
  $("out-lines").innerHTML = outLines.map((l, i) => `
    <div class="deal-line">
      <span class="grow">${esc(l.label)}
        <span class="muted">mv ${fmt(l.mv)}</span>
        ${l.basis_unknown ? '<span class="unknown">· basis unknown</span>'
                          : `<span class="muted">· basis ${fmt(l.basis)}</span>`}
        <span class="pv-out muted" data-pv-out="${i}"></span></span>
      ${adjusting() ? `
        <button type="button" class="btn ghost small" data-mkt="${i}" tabindex="-1"
                title="Use full market value for this card">=mkt</button>
        <input class="val" data-side="out" data-i="${i}" type="text"
               placeholder="agreed $" value="${esc(l.deal_value)}">` : ""}
      <span class="x" data-out="${i}">✕</span>
    </div>`).join("") || '<div class="muted" style="margin-bottom:8px">No cards leaving — a pure buy.</div>';

  $("in-lines").innerHTML = inLines.map((l, i) => `
    <div class="deal-line" style="flex-wrap:wrap">
      <input type="text" placeholder="Card name" style="flex:2;min-width:140px"
             data-in="${i}" data-f="name" value="${esc(l.name)}">
      <input type="text" placeholder="Set" style="flex:1;min-width:90px"
             data-in="${i}" data-f="set" value="${esc(l.set)}">
      <select data-in="${i}" data-f="is_graded" style="width:86px">
        <option value="1" ${l.is_graded ? "selected" : ""}>Slab</option>
        <option value="" ${!l.is_graded ? "selected" : ""}>Raw</option>
      </select>
      ${l.is_graded ? `
        <select data-in="${i}" data-f="company" style="width:80px">
          ${["PSA","BGS","CGC","TAG"].map(co => `<option ${l.company===co?"selected":""}>${co}</option>`).join("")}
        </select>
        <input type="text" placeholder="Grade" style="width:70px" data-in="${i}" data-f="grade" value="${esc(l.grade)}">
        <input type="text" placeholder="Cert #" style="width:110px" data-in="${i}" data-f="cert" value="${esc(l.cert)}">
        <input type="text" placeholder="Year" style="width:64px" data-in="${i}" data-f="year" value="${esc(l.year)}">
        ${l.company === "PSA" ? `<button type="button" class="btn ghost small" data-cert-lookup="${i}"
            title="Fetch name/set/# from PSA">${l._certBusy ? "…" : "PSA ↻"}</button>` : ""}` : ""}
      <input type="text" placeholder="market $" style="width:88px;text-align:right"
             data-in="${i}" data-f="market_value" value="${esc(l.market_value)}"
             title="What the card is worth — drives the basis split and the paper-gain math">
      ${adjusting() ? `
        <input class="val" type="text" placeholder="paid $ (pin)" data-side="in" data-i="${i}"
               value="${esc(l.deal_value)}" style="width:96px"
               title="Pin this card's cost; the rest of the deal total splits across the others">` : ""}
      <span class="pv-in muted" data-pv-in="${i}" style="min-width:92px;text-align:right"></span>
      <span class="x" data-inx="${i}">✕</span>
      ${l._certMsg ? `<div style="width:100%;font-size:11px;color:var(--${l._certOk ? "pos" : "neg"})">${esc(l._certMsg)}</div>` : ""}
    </div>`).join("") || '<div class="muted" style="margin-bottom:8px">Nothing arriving but cash — a pure sale.</div>';

  bindLineEvents();
  refresh();
}

function bindLineEvents() {
  document.querySelectorAll("#out-lines .x").forEach(x =>
    x.addEventListener("click", () => { outLines.splice(+x.dataset.out, 1); renderLines(); }));
  document.querySelectorAll("#in-lines .x").forEach(x =>
    x.addEventListener("click", () => { inLines.splice(+x.dataset.inx, 1); renderLines(); }));
  document.querySelectorAll("#out-lines [data-mkt]").forEach(b =>
    b.addEventListener("click", () => {
      const l = outLines[+b.dataset.mkt];
      if (l.mv != null) { l.deal_value = String(l.mv); renderLines(); }
    }));
  document.querySelectorAll("input.val").forEach(inp =>
    inp.addEventListener("input", () => {
      const arr = inp.dataset.side === "out" ? outLines : inLines;
      arr[+inp.dataset.i].deal_value = inp.value;
      refresh();
    }));
  document.querySelectorAll("[data-in][data-f]").forEach(el =>
    el.addEventListener(el.dataset.f === "name" || el.dataset.f === "market_value" ? "input" : "change", () => {
      const l = inLines[+el.dataset.in], f = el.dataset.f;
      if (f === "is_graded") { l.is_graded = !!el.value; renderLines(); }
      else if (f === "company") { l.company = el.value; renderLines(); }
      else { l[f] = el.value; refresh(); }
    }));
  document.querySelectorAll("[data-cert-lookup]").forEach(btn =>
    btn.addEventListener("click", () => certLookup(+btn.dataset.certLookup)));
}

async function certLookup(i) {
  const l = inLines[i];
  const cert = (l.cert || "").trim();
  if (!cert) { l._certMsg = "Enter a cert number first."; l._certOk = false; renderLines(); return; }
  l._certBusy = true; renderLines();
  try {
    const res = await postJSON("/api/psa/lookup", { cert });
    const d = res.data;
    if (!l.name)   l.name   = d.card_name   || l.name;
    if (!l.set)    l.set    = d.set_name    || l.set;
    if (!l.number) l.number = d.card_number || l.number;
    if (!l.year)   l.year   = d.year        || l.year;
    if (!l.grade)  l.grade  = d.grade       || l.grade;
    l._certMsg = `Filled from PSA cert${res.status === "cached" ? " (cached)" : ""} ✓`;
    l._certOk = true;
  } catch (err) {
    l._certMsg = err.message;
    l._certOk = false;
  }
  l._certBusy = false;
  renderLines();
}

/* ── the one price ── */
const cashPaid     = () => num($("cash-paid").value) ?? 0;
const cashReceived = () => num($("cash-received").value) ?? 0;
const myMarket     = () => outLines.reduce((a, l) => a + (l.mv || 0), 0);
const namedIn      = () => inLines.filter(l => (l.name || "").trim());
const theirMarket  = () => namedIn().reduce((a, l) => a + (num(l.market_value) || 0), 0);
const pureSale     = () => outLines.length && !namedIn().length && cashReceived() > 0;
const pureBuy      = () => !outLines.length && namedIn().length;

document.querySelectorAll(".price-chip").forEach(b =>
  b.addEventListener("click", () => {
    const m = myMarket();
    if (m > 0) { $("deal-price").value = String(Math.round(m * +b.dataset.pct) / 100); refresh(); }
  }));
$("deal-price").addEventListener("input", refresh);
$("adjust-mode").addEventListener("change", renderLines);
["cash-paid", "cash-received"].forEach(id => $(id).addEventListener("input", refresh));

function dealPrice() {
  if (pureSale()) return cashReceived();      // a pure sale's price IS the cash
  return num($("deal-price").value);
}

function payload() {
  return {
    counterparty: $("d-counterparty").value, location: $("d-location").value,
    payment_method: $("d-method").value,
    occurred_at: $("d-when").value ? $("d-when").value + ":00" : null,
    notes: $("d-notes").value,
    cash_amount: cashReceived() - cashPaid(),
    // the ONE agreed number: my side's total. Typed per-card pins ride along;
    // blanks split pro rata by market on both sides, in the engine.
    out_side_total: outLines.length ? dealPrice() : null,
    cards_out: outLines.map(l => ({ table: l.table, id: l.id,
      deal_value: adjusting() ? num(l.deal_value) : null })),
    cards_in: namedIn().map(l => ({ name: l.name, set: l.set, number: l.number,
      year: l.year, company: l.company, grade: l.grade, cert: l.cert,
      is_graded: l.is_graded,
      deal_value: adjusting() ? num(l.deal_value) : null,
      market_value: num(l.market_value) })),
  };
}

/* ── live preview: the engine's own math, before Save ── */
let pvTimer = null, pvSeq = 0;
function refresh() {
  $("out-total").textContent = outLines.length + " cards";
  $("in-total").textContent  = namedIn().length + " cards";
  const ps = pureSale();
  $("deal-price").disabled = ps;
  $("price-label").textContent = ps ? "Pure sale — deal total = cash received"
    : pureBuy() ? "Pure buy — their basis = cash paid" : "My cards are going out at ($)";
  if (ps) $("deal-price").value = String(cashReceived());
  const m = myMarket();
  $("price-hint").textContent = m > 0 ? `of my market ${fmt(m)}` : "";
  clearTimeout(pvTimer);
  pvTimer = setTimeout(preview, 220);
}

async function preview() {
  const hasWork = outLines.length || namedIn().length;
  if (!hasWork) { $("pv-sentence").textContent = "Add cards to see what will book."; return; }
  const seq = ++pvSeq;
  let res;
  try { res = await postJSON("/api/deals/preview", payload()); }
  catch (err) {
    if (seq !== pvSeq) return;
    $("pv-sentence").textContent = "Not enough to book yet: " + err.message;
    $("pv-market").textContent = ""; $("pv-warnings").innerHTML = "";
    $("t-realized").textContent = "—"; $("t-paper").textContent = "—";
    document.querySelectorAll(".pv-out,.pv-in").forEach(el => el.textContent = "");
    return;
  }
  if (seq !== pvSeq) return;

  // derived per-card numbers, greyed into each line
  (res.out_lines || []).forEach(o => {
    const i = outLines.findIndex(l => l.table === o.table && l.id === o.card_id);
    const el = document.querySelector(`[data-pv-out="${i}"]`);
    if (el) el.innerHTML = `→ books ${fmt(o.proceeds)}` +
      (o.realized_gain == null ? ' <span class="unknown">(gain ?)</span>'
        : ` <span class="${gainClass(o.realized_gain)}">(${fmtGain(o.realized_gain)})</span>`);
  });
  const named = namedIn();
  (res.in_lines || []).forEach((p, k) => {
    const i = inLines.indexOf(named[k]);
    const el = document.querySelector(`[data-pv-in="${i}"]`);
    if (el) el.textContent = `→ basis ${fmt(p.basis)}`;
  });

  const realized = (res.out_lines || []).reduce((a, o) => a + (o.realized_gain || 0), 0);
  const unknownN = (res.out_lines || []).filter(o => o.realized_gain == null).length;
  const paperKnown = (res.in_lines || []).every(p => p.market_value != null);
  const paper = (res.in_lines || []).reduce((a, p) =>
    a + ((p.market_value != null) ? p.market_value - p.basis : 0), 0);
  $("t-realized").textContent = fmtGain(realized) + (unknownN ? ` (+${unknownN} ?)` : "");
  $("t-realized").className = "big " + gainClass(realized);
  $("t-paper").textContent = (res.in_lines || []).length ? (paperKnown ? fmtGain(paper) : fmtGain(paper) + " (partial)") : "—";
  $("t-paper").className = "big " + gainClass(paper);

  const bits = [];
  if (res.out_lines.length) bits.push(`${res.out_lines.length} card${res.out_lines.length > 1 ? "s" : ""} out at ${fmt(res.v_out)}`);
  if (res.in_lines.length)  bits.push(`${res.in_lines.length} card${res.in_lines.length > 1 ? "s" : ""} in, basis ${fmt(res.v_in)}`);
  if (res.cash_amount)      bits.push(`cash ${fmtGain(res.cash_amount)}`);
  $("pv-sentence").textContent = "Books: " + bits.join(" · ");

  // The ONLY value judgment on this screen, and it is one-directional:
  // taking in more market than you give is the business working — green.
  // Giving more market than you take in is the thing worth a look — amber.
  const mineM = myMarket() + cashPaid();
  const theirsM = theirMarket() + cashReceived();
  const mk = $("pv-market");
  if (mineM > 0 && (namedIn().length === 0 || theirMarket() > 0)) {
    const diff = theirsM - mineM;
    if (diff > 0.5) {
      mk.innerHTML = `<span class="pos">Taking in ${fmt(diff)} more market value than you're giving.</span>`;
    } else if (diff < -0.5) {
      mk.innerHTML = `<span class="neg">Giving up ${fmt(-diff)} of market value in this deal.</span>`;
    } else mk.textContent = "";
  } else mk.textContent = "";

  $("pv-warnings").innerHTML = (res.warnings || [])
    .map(w => `<div class="warn" style="margin-top:4px">${esc(w)}</div>`).join("");
}

/* ── save ── */
$("save").addEventListener("click", async () => {
  const msg = $("save-msg");
  if ($("save").disabled) return;
  $("save").disabled = true;            // a double-click must not book twice
  $("save").textContent = "Saving…";
  msg.innerHTML = "";
  try {
    const res = await postJSON("/api/deals", payload());
    const warns = res.warnings || [];
    if (warns.length) {
      msg.innerHTML =
        `<div class="warn"><strong>Deal #${res.deal_id} saved with warnings:</strong><ul style="margin:6px 0 0 18px">`
        + warns.map(w => `<li>${esc(w)}</li>`).join("") + `</ul></div>`
        + `<a class="btn" href="/deals/${res.deal_id}">Open deal #${res.deal_id} →</a>`;
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      $("save").disabled = false; $("save").textContent = "Save Deal";
    } else {
      toastAfterReload(`Deal #${res.deal_id} saved.`, "success");
      window.location = `/deals/${res.deal_id}`;
    }
  } catch (err) {
    msg.innerHTML = `<div class="warn">${esc(err.message)}</div>`;
    $("save").disabled = false; $("save").textContent = "Save Deal";
  }
});

/* ── prefill handed over from the Evaluator ── */
function applyPrefill() {
  const raw = sessionStorage.getItem("cardvault_deal_prefill");
  if (!raw) return false;
  sessionStorage.removeItem("cardvault_deal_prefill");   // one-shot
  let p;
  try { p = JSON.parse(raw); } catch { return false; }

  // the evaluator prices per line, so it arrives in adjust mode with pins
  $("adjust-mode").checked = true;
  let outSum = 0;
  (p.cards_out || []).forEach(o => {
    const c = INVENTORY.find(x => x.table === o.table && x.id === o.id);
    if (!c) return;   // sold/changed since evaluating — skip rather than fake it
    outSum += num(o.deal_value) ?? 0;
    outLines.push({ table: c.table, id: c.id, name: c.name,
      label: (c.kind === "slab" ? `${c.company} ${c.grade} · ` : "RAW · ") + c.name,
      mv: c.market_value ?? c.basis,
      basis: c.basis, basis_unknown: c.basis_unknown,
      deal_value: String(o.deal_value ?? "") });
  });
  if (outSum > 0) $("deal-price").value = String(Math.round(outSum * 100) / 100);
  (p.cards_in || []).forEach(i => {
    inLines.push({ name: i.name || "", set: "", number: "", year: "", company: "PSA",
                   grade: "", cert: "", is_graded: true,
                   deal_value: String(i.deal_value ?? ""),
                   market_value: String(i.market_value ?? "") });
  });
  const c = num(p.cash) ?? 0;
  if (c > 0) $("cash-received").value = c;
  else if (c < 0) $("cash-paid").value = Math.abs(c);

  const missing = (p.cards_out || []).length - outLines.length;
  if (missing > 0) {
    $("save-msg").innerHTML =
      `<div class="warn">${missing} card(s) from the evaluation are no longer in active inventory and were skipped.</div>`;
  }
  return true;
}
if (!applyPrefill()) addIn();   /* seed one blank incoming row only if not prefilled */
if (!inLines.length) addIn();
renderLines();
</script>
{% endblock %}
